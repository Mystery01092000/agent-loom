[project]
name = "harness"
version = "0.1.0"
description = "Agentic harness: supervisor/worker/diagnosis/summarizer agents on the Claude API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1.0",
    "mcp>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
